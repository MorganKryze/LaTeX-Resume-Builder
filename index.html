<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LaTeX-Resume-Builder — Demo</title>
    <style>
      :root {
        --bg: #fafafa;
        --fg: #1a1a1a;
        --muted: #666;
        --accent: #0f3778;
        --accent-hover: #09234e;
        --on-accent: #fff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.25rem 1rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.5;
      }
      .cover {
        display: block;
        transition: transform .2s ease;
      }
      .cover:hover { transform: translateY(-2px); }
      .cover img {
        display: block;
        height: 90vh;
        width: auto;
        max-width: 100%;
        border-radius: 6px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, .12);
      }
      .download {
        position: fixed;
        right: 2rem;
        bottom: 2rem;
        display: inline-flex;
        align-items: center;
        height: 56px;
        padding: 0 1rem;
        background: var(--accent);
        color: var(--on-accent);
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
        border-radius: 999px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, .15), 0 2px 6px rgba(15, 55, 120, .35);
        overflow: hidden;
        z-index: 10;
        transition: background .2s ease, box-shadow .2s ease, padding .3s ease, transform .15s ease;
      }
      .download:hover {
        background: var(--accent-hover);
        box-shadow: 0 10px 28px rgba(0, 0, 0, .2), 0 4px 10px rgba(15, 55, 120, .45);
        padding-left: 1.4rem;
      }
      .download:active { transform: scale(.97); }
      .download .label {
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        white-space: nowrap;
        margin-right: 0;
        transition: max-width .3s ease, opacity .25s ease, margin-right .3s ease;
      }
      .download:hover .label,
      .download:focus-visible .label {
        max-width: 240px;
        opacity: 1;
        margin-right: .6rem;
      }
      .download svg { width: 22px; height: 22px; flex-shrink: 0; }
      @media (max-width: 640px) {
        body { padding: 1rem .75rem; }
        .cover img { height: auto; max-height: calc(100vh - 2rem); max-width: 100%; }
        .download {
          right: 1rem;
          bottom: 1rem;
          height: 52px;
          width: 52px;
          padding: 0;
          justify-content: center;
        }
        .download .label,
        .download:hover .label,
        .download:focus-visible .label {
          max-width: 0;
          opacity: 0;
          margin-right: 0;
        }
        .download:hover { padding-left: 0; }
        .download svg { width: 22px; height: 22px; }
      }
    </style>
  </head>
  <body>
    <a class="cover" href="pdf/resume.pdf" target="_blank" rel="noopener">
      <img src="resume.jpg" alt="Resume preview">
    </a>
    <a class="download" href="pdf/resume.pdf" download aria-label="Download the resume">
      <span class="label">Download</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v13"/>
        <path d="M7 11l5 5 5-5"/>
        <path d="M5 21h14"/>
      </svg>
    </a>
  </body>
</html>
