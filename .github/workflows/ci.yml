name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Sync Python dependencies
        run: uv sync --all-groups
      - name: Ruff
        run: uv run ruff check .
      - name: Black
        run: uv run black --check .
      - name: Unit tests
        run: uv run python -m unittest tests.tests -v

  build-pdf:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Cache the compiled outputs keyed off everything that affects the PDF:
      # .tex sources, the YAML config, the style package, the build scripts,
      # the Makefile, and the pinned Python lockfile. If none of those changed
      # (e.g. the push only touched docs, the workflow's gh-pages assembly, or
      # site/index.html) the cache is restored and the LaTeX compile is skipped.
      - name: Restore build cache
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/
            examples/resume-en.jpg
            examples/resume-fr.jpg
          key: ${{ runner.os }}-build-pdf-${{ hashFiles('examples/**/*.tex', 'options.example.yml', 'Makefile', 'style/**', 'scripts/**', 'uv.lock') }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          enable-cache: true
      - name: Install system dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Sync Python dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: uv sync
      - name: Write config.tex from options.example.yml
        if: steps.cache.outputs.cache-hit != 'true'
        run: uv run python scripts/write_config.py --config options.example.yml --project-root .
      - name: Compile LaTeX (EN + FR)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3 (3.3.0)
        env:
          # Expose resume.cls (in style/) to LaTeX. work_in_root_file_dir below
          # cd's into examples/, so a relative ../style/ path is correct here
          # (and portable — no need to know the absolute container path).
          TEXINPUTS: "../style/:"
        with:
          root_file: |
            examples/resume-en.tex
            examples/resume-fr.tex
          work_in_root_file_dir: true
      - name: Convert + merge PDFs, generate JPEG cover
        if: steps.cache.outputs.cache-hit != 'true'
        run: uv run python scripts/convert_and_merge.py --config options.example.yml --project-root .
      - name: Generate QR code
        if: steps.cache.outputs.cache-hit != 'true'
        run: uv run python scripts/generate_qr_code.py --config options.example.yml --project-root .
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-output
          path: |
            build/
            examples/resume-en.jpg
            examples/resume-fr.jpg
          if-no-files-found: error

  publish-gh-pages:
    runs-on: ubuntu-latest
    needs: build-pdf
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-output
          path: artifact/
      - name: Assemble site/ for gh-pages
        run: |
          mkdir -p site/pdf
          cp artifact/build/resume.pdf site/pdf/resume.pdf
          cp artifact/examples/resume-en.jpg site/resume.jpg

          # Derive HTML accent palette from options.example.yml accent_color
          # (single source of truth shared with the LaTeX + QR pipeline).
          ACCENT_RGB=$(grep -E '^accent_color:' options.example.yml | sed 's/.*\[//; s/\].*//' | tr -d ' ')
          IFS=, read -r R G B <<< "$ACCENT_RGB"
          ACCENT_HEX=$(printf '%02x%02x%02x' "$R" "$G" "$B")
          ACCENT_HOVER_HEX=$(printf '%02x%02x%02x' $((R*65/100)) $((G*65/100)) $((B*65/100)))
          LUM=$(( (2126*R + 7152*G + 722*B) / 10000 ))
          if [ "$LUM" -lt 128 ]; then ON_ACCENT="fff"; else ON_ACCENT="1a1a1a"; fi
          ACCENT_RGB_CSV="$R, $G, $B"

          cat > site/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>LaTeX-Resume-Builder — Demo</title>
              <style>
                :root {
                  --bg: #fafafa;
                  --fg: #1a1a1a;
                  --muted: #666;
                  --accent: #${ACCENT_HEX};
                  --accent-hover: #${ACCENT_HOVER_HEX};
                  --on-accent: #${ON_ACCENT};
                }
                * { box-sizing: border-box; }
                body {
                  margin: 0;
                  min-height: 100vh;
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  justify-content: center;
                  padding: 1.25rem 1rem;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
                  background: var(--bg);
                  color: var(--fg);
                  line-height: 1.5;
                }
                .cover {
                  display: block;
                  transition: transform .2s ease;
                }
                .cover:hover { transform: translateY(-2px); }
                .cover img {
                  display: block;
                  height: 90vh;
                  width: auto;
                  max-width: 100%;
                  border-radius: 6px;
                  box-shadow: 0 8px 32px rgba(0, 0, 0, .12);
                }
                .download {
                  position: fixed;
                  right: 2rem;
                  bottom: 2rem;
                  display: inline-flex;
                  align-items: center;
                  height: 56px;
                  padding: 0 1rem;
                  background: var(--accent);
                  color: var(--on-accent);
                  font-size: 1rem;
                  font-weight: 700;
                  text-decoration: none;
                  border-radius: 999px;
                  box-shadow: 0 6px 20px rgba(0, 0, 0, .15), 0 2px 6px rgba(${ACCENT_RGB_CSV}, .35);
                  overflow: hidden;
                  z-index: 10;
                  transition: background .2s ease, box-shadow .2s ease, padding .3s ease, transform .15s ease;
                }
                .download:hover {
                  background: var(--accent-hover);
                  box-shadow: 0 10px 28px rgba(0, 0, 0, .2), 0 4px 10px rgba(${ACCENT_RGB_CSV}, .45);
                  padding-left: 1.4rem;
                }
                .download:active { transform: scale(.97); }
                .download .label {
                  max-width: 0;
                  opacity: 0;
                  overflow: hidden;
                  white-space: nowrap;
                  margin-right: 0;
                  transition: max-width .3s ease, opacity .25s ease, margin-right .3s ease;
                }
                .download:hover .label,
                .download:focus-visible .label {
                  max-width: 240px;
                  opacity: 1;
                  margin-right: .6rem;
                }
                .download svg { width: 22px; height: 22px; flex-shrink: 0; }
                @media (max-width: 640px) {
                  body { padding: 1rem .75rem; }
                  .cover img { height: auto; max-height: calc(100vh - 2rem); max-width: 100%; }
                  .download {
                    right: 1rem;
                    bottom: 1rem;
                    height: 52px;
                    width: 52px;
                    padding: 0;
                    justify-content: center;
                  }
                  .download .label,
                  .download:hover .label,
                  .download:focus-visible .label {
                    max-width: 0;
                    opacity: 0;
                    margin-right: 0;
                  }
                  .download:hover { padding-left: 0; }
                  .download svg { width: 22px; height: 22px; }
                }
              </style>
            </head>
            <body>
              <a class="cover" href="pdf/resume.pdf" target="_blank" rel="noopener">
                <img src="resume.jpg" alt="Resume preview">
              </a>
              <a class="download" href="pdf/resume.pdf" download aria-label="Download the resume">
                <span class="label">Download</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 3v13"/>
                  <path d="M7 11l5 5 5-5"/>
                  <path d="M5 21h14"/>
                </svg>
              </a>
            </body>
          </html>
          HTML
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
